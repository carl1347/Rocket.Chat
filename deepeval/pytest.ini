[pytest]
pythonpath = .
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
markers =
    threads: Hilos de conversación
    rbac: Control de acceso basado en roles
    dm: Mensajería directa
    retention: Retención y depuración
    webhooks: Webhooks e integraciones
    unit: Pruebas sin Ollama (recuperación, datasets, cliente)
